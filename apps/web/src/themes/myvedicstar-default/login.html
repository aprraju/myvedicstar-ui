<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body>
    <header class="topbar shell">
      <a class="brand" href="home.html"
        ><span class="om">ॐ</span
        ><span
          ><strong>MyPanchang</strong>
          <div class="tagline">Timeless Wisdom for Every Day</div></span
        ></a
      >
      <nav style="display: flex; gap: 28px; font-size: 12px; margin-left: auto">
        <a href="#features">Features</a><a href="#">About</a><a href="#">Help</a>
      </nav>
      <div class="actions">
        <a class="outline-btn" href="login.html">Login</a
        ><a class="primary-btn" href="login.html">Register</a>
      </div>
    </header>
    <main class="shell" style="max-width: 520px; padding-top: 70px">
      <section class="panel" style="padding: 34px">
        <div style="text-align: center">
          <span class="om" style="display: inline-grid">ॐ</span>
          <h1 style="font-family: var(--font-display)">Welcome Back</h1>
          <p style="color: var(--muted); font-size: 13px">
            Login to access your personalized Panchang,<br />save locations and get reminders.
          </p>
        </div>
        <input
          style="
            width: 100%;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 9px;
            margin: 20px 0 10px;
          "
          placeholder="Email address"
        /><input
          style="
            width: 100%;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 9px;
            margin-bottom: 18px;
          "
          type="password"
          placeholder="Password"
        /><a class="primary-btn" style="justify-content: center" href="dashboard.html">Login</a>
        <p style="text-align: center; font-size: 12px; color: var(--muted); margin: 24px">or continue with</p>
        <button class="outline-btn" style="width: 100%; justify-content: center; margin-bottom: 10px">
          Continue with Google</button
        ><button class="outline-btn" style="width: 100%; justify-content: center">Continue with Apple</button>
      </section>
    </main>
  </body>
</html>
