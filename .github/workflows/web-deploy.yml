name: Web deploy

# Deploys a web build artifact (`web-dist`, produced once by the Web workflow) to Azure Static Web Apps.
# Called by the Web workflow after every successful build of main, and runnable by hand to redeploy or roll back:
#   Actions → Web deploy → Run workflow → the run ID of the Web workflow run whose build to deploy.
#
# Settings: infrastructure/web/static-web-apps/environments/<environment>.env (public values, committed). A non-empty
# GitHub variable with the same name overrides the file, e.g. MVS_FEATURE_FLAGS, without a commit.
# GitHub variables required: AZURE_CLIENT_ID, AZURE_TENANT_ID (Azure OIDC sign-in; no stored Azure secrets).
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      artifact-run-id:
        description: 'Workflow run that produced the web-dist artifact (default: the calling run).'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production]
        default: production
      artifact-run-id:
        description: 'Run ID of the Web workflow run whose web-dist build to deploy (redeploy or rollback).'
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The GitHub environment of the same name: its protection rules apply, and Azure trusts this job through the
    # federated credential subject repo:<owner>/<repo>:environment:<name>.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.site-url }}
    # Never run two deployments to the same environment at once; never cancel one half way.
    concurrency:
      group: web-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Azure OIDC sign-in
      actions: read # download an artifact from another run (redeploy / rollback)
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      SETTINGS_FILE: infrastructure/web/static-web-apps/environments/${{ inputs.environment }}.env
      BUILD_ID: ${{ inputs.artifact-run-id || github.sha }}
      SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }} # optional fallback when OIDC is not set up
      # Optional overrides of the settings file (blank = use the file).
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_STATIC_WEB_APP_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_SUBSCRIPTION_ID: ${{ vars.AZURE_STATIC_WEB_APP_SUBSCRIPTION_ID }}
      MVS_SITE_URL: ${{ vars.MVS_SITE_URL }}
      MVS_API_BASE_URL: ${{ vars.MVS_API_BASE_URL }}
      MVS_API_ENDPOINT_PREFIX: ${{ vars.MVS_API_ENDPOINT_PREFIX }}
      MVS_API_ENDPOINTS: ${{ vars.MVS_API_ENDPOINTS }}
      MVS_AUTH_MODE: ${{ vars.MVS_AUTH_MODE }}
      MVS_AUTH_CLIENT_ID: ${{ vars.MVS_AUTH_CLIENT_ID }}
      MVS_FEATURE_FLAGS: ${{ vars.MVS_FEATURE_FLAGS }}
      MVS_TELEMETRY_ENABLED: ${{ vars.MVS_TELEMETRY_ENABLED }}
      MVS_TELEMETRY_SAMPLE_RATE: ${{ vars.MVS_TELEMETRY_SAMPLE_RATE }}
    steps:
      - uses: actions/checkout@v5

      # Fail fast with a precise message before any install or Azure call.
      - name: Check settings
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          problems=()
          [[ -f "$SETTINGS_FILE" ]] || problems+=("$SETTINGS_FILE does not exist")
          if [[ -z "$SWA_DEPLOYMENT_TOKEN" ]]; then
            guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
            for name in AZURE_CLIENT_ID AZURE_TENANT_ID; do
              if [[ -z "${!name}" ]]; then problems+=("GitHub variable $name is not set")
              elif [[ ! "${!name}" =~ $guid ]]; then problems+=("GitHub variable $name must be a GUID")
              fi
            done
          fi
          if (( ${#problems[@]} )); then
            for problem in "${problems[@]}"; do echo "::error title=Deployment settings::$problem"; done
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Deployment scripts reuse the app's config schema and header builder; no app build happens here.
      - run: npm ci

      # Same run: the artifact uploaded by the calling Web workflow.
      - name: Download build artifact
        if: inputs.artifact-run-id == ''
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist

      # Redeploy / rollback: the artifact of an earlier Web workflow run.
      - name: Download build artifact from run ${{ inputs.artifact-run-id }}
        if: inputs.artifact-run-id != ''
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}

      # The identity holds one role on the Static Web App only (read + deployment token), whose subscription comes from
      # the settings file; it needs no default subscription.
      - name: Azure sign-in (OIDC)
        if: env.SWA_DEPLOYMENT_TOKEN == ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Validate, deploy and smoke test
        id: deploy
        run: >-
          bash infrastructure/web/static-web-apps/scripts/deploy.sh --environment "$TARGET_ENVIRONMENT"
          --dist apps/web/dist --env-file "$SETTINGS_FILE"

      - name: Rollback instructions
        if: failure()
        run: |
          {
            echo "### ❌ Web deployment to $TARGET_ENVIRONMENT failed"
            echo "See the 'Validate, deploy and smoke test' log for the failing step."
            echo "To restore the last good release: Actions → **Web deploy** → Run workflow →"
            echo "artifact run ID of the last successful **Web** run."
          } >> "$GITHUB_STEP_SUMMARY"
